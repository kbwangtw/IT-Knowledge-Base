name: weekly external links

# 每週檢查文章裡的外部連結（別人的網站）。外部網站狀況不穩，不放在 PR 的 check site 裡擋 merge；
# 有失效連結時開一個 issue（已經有就更新內容），全部正常時把那個 issue 關掉。
on:
  schedule:
    - cron: "17 1 * * 1" # 每週一 01:17 UTC（台灣時間 09:17）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  SITE_DIR: _site/IT-Knowledge-Base
  ISSUE_TITLE: 每週外部連結檢查：有失效連結

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll and html-proofer
        run: gem install --no-document jekyll:4.4.1 minima:2.5.2 kramdown-parser-gfm:1.1.0 html-proofer:5.2.3

      - name: Build site
        run: jekyll build --baseurl /IT-Knowledge-Base -d "$SITE_DIR"

      # 403／429／999 多半是對方網站擋自動程式，不代表連結失效，所以略過。
      - name: Check external links
        id: proof
        run: |
          set +e
          htmlproofer "$SITE_DIR" --root-dir _site --no-enforce-https --checks Links \
            --ignore-status-codes "403,429,999" \
            --typhoeus '{"followlocation":true,"connecttimeout":15,"timeout":30}' \
            --hydra '{"max_concurrency":8}' > proofer.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          # 去掉 JSON 格式的除錯訊息與建置目錄前綴，只留給人看的結果
          grep -v '^{' proofer.log | sed "s#$PWD/_site##g" > report.txt
          cat report.txt

      - name: Open or update issue
        if: steps.proof.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "最近一次檢查：$(date -u '+%Y-%m-%d %H:%M UTC')，[執行紀錄]($RUN_URL)"
            echo
            echo "處理方式：找到新網址就更新文章；網站已消失就改成 Wayback Machine 封存連結或刪除。修好後可到 Actions 手動執行 weekly external links，全部正常時這個 issue 會自動關閉。"
            echo
            echo '```text'
            head -c 60000 report.txt
            echo '```'
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
            echo "已更新 issue #$number"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

      - name: Close issue when all links pass
        if: steps.proof.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "$(date -u '+%Y-%m-%d') 檢查全部通過，自動關閉。"
          fi
